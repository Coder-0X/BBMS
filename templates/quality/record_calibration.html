{% extends "base.html" %}
{% block title %}Record Calibration{% endblock %}
{% block content %}
<div class="page-header"><h1>Record Equipment Calibration</h1></div>
<div class="card" style="max-width:560px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="grid-2">
        <div class="form-group">
          <label>Equipment Name *</label>
          <input type="text" name="name" required placeholder="e.g. Centrifuge A1" value="{{ request.GET.name }}">
        </div>
        <div class="form-group">
          <label>Asset ID *</label>
          <input type="text" name="asset_id" required placeholder="e.g. CENT-001" value="{{ request.GET.asset_id }}">
        </div>
      </div>
      <div class="form-group">
        <label>Equipment Type *</label>
        <select name="equipment_type" required>
          {% for val, label in equipment_types %}<option value="{{ val }}" {% if request.GET.type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Last Calibrated *</label>
          <input type="date" name="last_calibrated" required>
        </div>
        <div class="form-group">
          <label>Next Due *</label>
          <input type="date" name="next_due" required>
        </div>
      </div>
      <div class="form-group">
        <label>Calibrated By *</label>
        <input type="text" name="calibrated_by" required placeholder="Name or service company">
      </div>
      <div class="form-group">
        <label>Certificate Reference</label>
        <input type="text" name="certificate_ref" placeholder="e.g. CAL-2026-0042">
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:.5rem">
        <input type="checkbox" name="within_spec" id="within_spec" checked>
        <label for="within_spec" style="margin:0">Within specification</label>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" rows="2" style="width:100%"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Record</button>
      <a href="{% url 'quality:calibration_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
