{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blood Bank Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bb-navbar sticky-top">
    <div class="container-fluid py-1">
      <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
        <i class="fas fa-tint me-2"></i>Blood Bank
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'donor_list' %}">Donors</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'donation_list' %}">Donations</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lab_list' %}">Lab</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'inventory_list' %}">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'patient_list' %}">Patients</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'staff_list' %}">Staff</a></li>
          {% if user.is_authenticated %}
            <li class="nav-item">
              <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="nav-link btn btn-link bb-logout-btn">Logout</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-lg-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
