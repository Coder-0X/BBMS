{% extends "base.html" %}
{% block title %}Record Processing — {{ unit.did }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Record Processing</h1>
  <span class="subtitle"><code>{{ unit.did }}</code></span>
</div>
<div class="card" style="max-width:540px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Processing Type *</label>
        <select name="processing_type" required>
          <option value="leukoreduction">Leukoreduction</option>
          <option value="irradiation">Irradiation</option>
          <option value="washing">Washing</option>
          <option value="cmv_testing">CMV Testing</option>
          <option value="pathogen_reduction">Pathogen Reduction</option>
          <option value="whole_blood_separation">Whole Blood Separation</option>
          <option value="freeze">Freeze</option>
          <option value="thaw">Thaw</option>
        </select>
      </div>
      <div id="cmv_result_field" style="display:none" class="form-group">
        <label>CMV Result</label>
        <select name="cmv_result">
          <option value="negative">Negative</option>
          <option value="positive">Positive</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>SOP Version</label>
          <input type="text" name="sop_version" value="1.0">
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" placeholder="Optional notes"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Record</button>
      <a href="{% url 'inventory:unit_detail' unit.did %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
<script>
  document.querySelector('[name=processing_type]').addEventListener('change', function() {
    document.getElementById('cmv_result_field').style.display = this.value === 'cmv_testing' ? '' : 'none';
  });
</script>
{% endblock %}
