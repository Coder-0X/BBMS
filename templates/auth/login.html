{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-lg-5 col-md-7">
    <div class="card bb-card p-4">
      <div class="card-body">
        <h1 class="h3 bb-section-title mb-2">Login</h1>
        <p class="text-muted mb-4">Sign in to inspect the modular starter.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-danger w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
