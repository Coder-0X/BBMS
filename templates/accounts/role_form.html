{% extends "base.html" %}
{% block title %}Create Role{% endblock %}
{% block content %}
<div class="page-header"><h1>Create Role</h1></div>
<div class="card" style="max-width:580px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Role Name *</label>
        <input type="text" name="name" required placeholder="e.g. Blood Bank Technician">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" name="description" placeholder="Short description of this role's responsibilities">
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;font-weight:normal;cursor:pointer">
          <input type="checkbox" name="branch_scoped" value="on" checked>
          <span>Branch-scoped (role applies only at the assigned branch)</span>
        </label>
      </div>
      <div class="form-group">
        <label>Permissions</label>
        <div style="border:1px solid #ddd;border-radius:5px;padding:.75rem;background:#fafafa;max-height:250px;overflow-y:auto">
          {% for perm in permissions %}
          <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;font-weight:normal;margin-bottom:.4rem;cursor:pointer">
            <input type="checkbox" name="permission_ids" value="{{ perm.pk }}">
            <span><code style="font-size:.85rem">{{ perm.code }}</code>{% if perm.description %} — <span style="color:#888;font-size:.8rem">{{ perm.description }}</span>{% endif %}</span>
          </label>
          {% empty %}
          <span style="color:#aaa;font-size:.875rem">No permissions defined. Create permissions first.</span>
          {% endfor %}
        </div>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Create Role</button>
        <a href="{% url 'accounts:role_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
