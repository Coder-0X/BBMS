{% extends "base.html" %}
{% block title %}Create User{% endblock %}
{% block content %}
<div class="page-header"><h1>Create New User</h1></div>
<div class="card" style="max-width:580px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username *</label>
        <input type="text" name="username" required placeholder="Unique login username" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Display Name *</label>
        <input type="text" name="display_name" required placeholder="Full name shown in the system">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" required minlength="12" autocomplete="new-password"
               placeholder="Minimum 12 characters">
      </div>
      <div class="form-group">
        <label>Home Branch</label>
        <select name="branch_id">
          <option value="">No specific branch (system-wide)</option>
          {% for branch in branches %}
          <option value="{{ branch.pk }}">{{ branch.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Initial Roles</label>
        <div style="border:1px solid #ddd;border-radius:5px;padding:.75rem;background:#fafafa;max-height:180px;overflow-y:auto">
          {% for role in roles %}
          <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;font-weight:normal;margin-bottom:.5rem;cursor:pointer">
            <input type="checkbox" name="role_ids" value="{{ role.pk }}">
            <span><strong>{{ role.name }}</strong>{% if role.description %} — <span style="color:#888;font-size:.8rem">{{ role.description }}</span>{% endif %}</span>
          </label>
          {% empty %}
          <span style="color:#aaa;font-size:.875rem">No roles defined yet. Create roles in the admin panel first.</span>
          {% endfor %}
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;font-weight:normal;cursor:pointer">
          <input type="checkbox" name="is_staff" value="on">
          <span>Staff (can access admin panel and user management)</span>
        </label>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
