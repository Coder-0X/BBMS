{% extends "base.html" %}
{% block title %}Antibody Screen{% endblock %}
{% block content %}
<div class="page-header"><h1>Antibody Screen</h1></div>
<div class="card" style="max-width:540px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="request_id" value="{{ request.GET.request_id }}">
      <div class="form-group">
        <label>Sample Accession Number *</label>
        <input type="text" name="accession_number" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Method *</label>
          <select name="method" required>
            <option value="IAT">IAT</option>
            <option value="gel">Gel Card</option>
            <option value="LISS">LISS</option>
            <option value="PEG">PEG</option>
            <option value="solid_phase">Solid Phase</option>
          </select>
        </div>
        <div class="form-group">
          <label>Screen Cell Lot *</label>
          <input type="text" name="screen_cell_lot" required>
        </div>
      </div>
      <div class="form-group">
        <label>Overall Result *</label>
        <select name="overall_result" required>
          <option value="negative">Negative</option>
          <option value="positive">Positive — Investigation Required</option>
          <option value="invalid">Invalid</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Record Screen</button>
    </form>
  </div>
</div>
{% endblock %}
