{% extends "base.html" %}
{% block title %}New Branch{% endblock %}
{% block content %}
<div class="page-header"><h1>Create New Branch</h1></div>
<div class="card" style="max-width:540px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Branch Name *</label>
        <input type="text" name="name" required placeholder="e.g. General Hospital Blood Bank">
      </div>
      <div class="form-group">
        <label>Facility Code (3 letters) *</label>
        <input type="text" name="facility_code" required maxlength="3" placeholder="e.g. GHB"
               style="text-transform:uppercase;font-family:monospace;letter-spacing:.2rem">
        <div style="font-size:.75rem;color:#888;margin-top:.3rem">Used as the prefix in Donation IDs (e.g. GHB260001X)</div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" placeholder="Full physical address"></textarea>
      </div>
      <div class="form-group">
        <label>Timezone</label>
        <input type="text" name="timezone" value="UTC" placeholder="e.g. Asia/Dhaka, Europe/London">
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Create Branch</button>
        <a href="{% url 'core:branch_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
